<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동네 리포트 — Rent.li</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <div class="header-row">
        <div>
          <h1>동네 리포트</h1>
          <p class="subtitle">이 동네는 어떤 곳인지, 실거래 기록으로 읽어드립니다</p>
        </div>
        <div class="auth-area">
          <a href="simple.html" class="btn-secondary">간단검색</a>
          <a href="calc.html" class="btn-secondary">계산기</a>
          <a href="today.html" class="btn-secondary">오늘의 집값은?</a>
          <a href="index.html" class="btn-secondary">실거래 검색</a>
        </div>
      </div>
    </header>

    <main>
      <section class="search-panel">
        <div class="field-group">
          <label class="field-label" for="district-select">지역을 골라주세요</label>
          <select id="district-select" class="select report-select">
            <option value="">지역 선택…</option>
          </select>
        </div>
        <p class="calc-note">
          빌라·단독 전월세 최근 3개월 실거래를 동별로 모아 성격을 정리합니다.
          아파트·오피스텔은 포함되지 않습니다.
        </p>
      </section>

      <section id="report-section" class="hidden">
        <div class="result-head">
          <div>
            <h2 class="stats-title" id="report-title"></h2>
            <p class="result-condition" id="report-sub"></p>
          </div>
        </div>
        <div id="report-list" class="report-list"></div>
      </section>

      <div id="status-msg" class="status-msg hidden" role="status"></div>
    </main>

    <footer class="site-footer">
      <a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보 처리방침</a> · <a href="help.html">이용 가이드</a> · <a href="report.html">동네 리포트</a>
      <span class="footer-note">
        국토교통부 실거래가 기준 · 거래가 적은 동은 성격을 단정하지 않습니다
      </span>
    </footer>
  </div>

  <script src="analytics.js"></script>
  <script src="profile.js"></script>
  <script src="report.js"></script>
</body>
</html>
