<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단검색 — Rent.li</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <div class="header-row">
        <div>
          <h1>간단검색</h1>
          <p class="subtitle">몇 가지만 답하면, 갈 수 있는 지역을 찾아드립니다</p>
        </div>
        <div class="auth-area">
          <a href="calc.html" class="btn-secondary">계산기</a>
          <a href="index.html" class="btn-secondary">실거래 검색</a>
          <a href="today.html" class="btn-secondary">오늘의 집값은?</a>
          <a href="help.html" class="btn-secondary">이용 가이드</a>
        </div>
      </div>
    </header>

    <main>
      <!-- 단계형 질문 -->
      <section id="wizard" class="wizard">
        <div class="wizard-progress">
          <div class="wizard-bar"><span id="wizard-bar-fill"></span></div>
          <span class="wizard-count" id="wizard-count"></span>
        </div>

        <!-- 1. 전세 / 월세 -->
        <div class="wizard-step" data-step="rentType">
          <h2 class="wizard-q">전세와 월세, 어느 쪽으로 찾으세요?</h2>
          <div class="wizard-options">
            <button class="wizard-option" data-value="전세">
              <strong>전세</strong><span>보증금만 내고 월세 없이</span>
            </button>
            <button class="wizard-option" data-value="월세">
              <strong>월세</strong><span>보증금 + 매달 월세</span>
            </button>
          </div>
        </div>

        <!-- 2. 보증금 예산 -->
        <div class="wizard-step hidden" data-step="deposit">
          <h2 class="wizard-q">보증금은 얼마까지 가능하세요?</h2>
          <div class="wizard-input-row">
            <input type="number" id="deposit-input" class="wizard-input" placeholder="0" min="0" step="1000"
                   inputmode="numeric" aria-label="보증금 예산 (만원)" />
            <span class="wizard-unit">만원</span>
          </div>
          <p class="wizard-preview" id="deposit-preview">금액을 입력해 주세요</p>
          <div class="wizard-quick" id="deposit-quick">
            <button class="chip" data-value="3000">3,000만</button>
            <button class="chip" data-value="5000">5,000만</button>
            <button class="chip" data-value="10000">1억</button>
            <button class="chip" data-value="20000">2억</button>
            <button class="chip" data-value="30000">3억</button>
            <button class="chip" data-value="50000">5억</button>
          </div>
        </div>

        <!-- 3. 월세 예산 (월세 선택 시에만) -->
        <div class="wizard-step hidden" data-step="rent">
          <h2 class="wizard-q">월세는 매달 얼마까지 괜찮으세요?</h2>
          <div class="wizard-input-row">
            <input type="number" id="rent-input" class="wizard-input" placeholder="0" min="0" step="10"
                   inputmode="numeric" aria-label="월세 예산 (만원)" />
            <span class="wizard-unit">만원 / 월</span>
          </div>
          <p class="wizard-preview" id="rent-preview">비워두면 보증금만 보고 찾습니다</p>
          <div class="wizard-quick" id="rent-quick">
            <button class="chip" data-value="30">30만</button>
            <button class="chip" data-value="50">50만</button>
            <button class="chip" data-value="70">70만</button>
            <button class="chip" data-value="100">100만</button>
          </div>
        </div>

        <!-- 4. 지역 -->
        <div class="wizard-step hidden" data-step="region">
          <h2 class="wizard-q">어느 지역에서 찾을까요?</h2>
          <div class="wizard-options wizard-options-4">
            <button class="wizard-option" data-value=""><strong>수도권 전체</strong><span>서울·경기·인천</span></button>
            <button class="wizard-option" data-value="seoul"><strong>서울</strong><span>25개 자치구</span></button>
            <button class="wizard-option" data-value="gyeonggi"><strong>경기</strong><span>47개 시·군·구</span></button>
            <button class="wizard-option" data-value="incheon"><strong>인천</strong><span>11개 군·구</span></button>
          </div>
        </div>

        <div class="wizard-nav">
          <button id="wizard-back" class="btn-secondary hidden">← 이전</button>
          <button id="wizard-next" class="btn-primary hidden">다음 →</button>
        </div>
      </section>

      <!-- 결과 (질문이 끝나면 이것만 보인다) -->
      <section id="result-section" class="hidden">
        <div class="result-head">
          <div>
            <h2 class="stats-title" id="result-title"></h2>
            <p class="result-condition" id="result-condition"></p>
          </div>
          <button id="restart-btn" class="btn-secondary">조건 바꾸기</button>
        </div>
        <p class="map-foot" id="result-note"></p>
        <div id="result-list" class="match-list"></div>
      </section>

      <div id="status-msg" class="status-msg hidden" role="status"></div>
    </main>

    <footer class="site-footer">
      <a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보 처리방침</a> · <a href="help.html">이용 가이드</a> · <a href="calc.html">계산기</a>
      <span class="footer-note">국토교통부 실거래가 기준 · 빌라·단독 최근 3개월 평균</span>
    </footer>
  </div>

  <script src="analytics.js"></script>
  <script src="match.js"></script>
  <script src="simple.js"></script>
</body>
</html>
