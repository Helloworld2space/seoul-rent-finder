<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단검색 — Rent.li</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <div class="header-row">
        <div>
          <h1>간단검색</h1>
          <p class="subtitle">예산만 입력하면, 갈 수 있는 지역을 찾아드립니다</p>
        </div>
        <div class="auth-area">
          <a href="index.html" class="btn-secondary">실거래 검색</a>
          <a href="today.html" class="btn-secondary">오늘의 집값은?</a>
          <a href="help.html" class="btn-secondary">이용 가이드</a>
        </div>
      </div>
    </header>

    <main>
      <!-- 조건 입력 -->
      <section class="search-panel">
        <div class="field-group">
          <label class="field-label">어떤 방식으로 찾으세요?</label>
          <div class="chips" role="group" id="rent-type-chips">
            <button class="chip active" data-rent-type="전세">전세</button>
            <button class="chip" data-rent-type="월세">월세</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="deposit-input">
            보증금 예산 <span class="hint">(만원 · 예: 3억이면 30000)</span>
          </label>
          <div class="range-inputs">
            <input type="number" id="deposit-input" class="input-num" placeholder="30000" min="0" step="1000" />
            <span id="deposit-preview" class="budget-preview"></span>
          </div>
          <div class="chips small quick-budget" role="group" id="deposit-quick">
            <button class="chip" data-deposit="5000">5,000만</button>
            <button class="chip" data-deposit="10000">1억</button>
            <button class="chip" data-deposit="20000">2억</button>
            <button class="chip" data-deposit="30000">3억</button>
            <button class="chip" data-deposit="50000">5억</button>
          </div>
        </div>

        <div class="field-group hidden" id="rent-field">
          <label class="field-label" for="rent-input">
            월세 예산 <span class="hint">(만원 · 비워두면 보증금만 고려)</span>
          </label>
          <div class="range-inputs">
            <input type="number" id="rent-input" class="input-num" placeholder="70" min="0" step="10" />
            <span class="budget-preview">만원 / 월</span>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">지역 <span class="hint">(선택 안 하면 수도권 전체)</span></label>
          <div class="chips small" role="group" id="region-chips">
            <button class="chip active" data-region="">수도권 전체</button>
            <button class="chip" data-region="seoul">서울</button>
            <button class="chip" data-region="gyeonggi">경기</button>
            <button class="chip" data-region="incheon">인천</button>
          </div>
        </div>

        <button id="find-btn" class="btn-primary">갈 수 있는 지역 찾기</button>
      </section>

      <!-- 결과 -->
      <section id="result-section" class="stats-section hidden">
        <h2 class="stats-title" id="result-title"></h2>
        <p class="map-foot" id="result-note"></p>
        <div id="result-list" class="match-list"></div>
      </section>

      <div id="status-msg" class="status-msg hidden" role="status"></div>
    </main>

    <footer class="site-footer">
      <a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보 처리방침</a> · <a href="help.html">이용 가이드</a> · <a href="simple.html">간단검색</a>
      <span class="footer-note">국토교통부 실거래가 기준 · 빌라·단독 최근 3개월 평균</span>
    </footer>
  </div>

  <script src="analytics.js"></script>
  <script src="match.js"></script>
  <script src="simple.js"></script>
</body>
</html>
